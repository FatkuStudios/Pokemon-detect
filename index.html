<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PC Monitor" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>Pokémon Center Monitor</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:        #0a0a0f;
      --surface:   #13131a;
      --border:    #1e1e2e;
      --accent:    #ffcb05;   /* Pokémon yellow */
      --red:       #ff3b5c;
      --green:     #00e5a0;
      --muted:     #555570;
      --text:      #e8e8f0;
      --subtext:   #8888a8;
      --font-head: 'Syne', sans-serif;
      --font-mono: 'DM Mono', monospace;
      --safe-top:  env(safe-area-inset-top, 0px);
      --safe-bot:  env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── Layout shell ── */
    .shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bot);
    }

    /* ── Header ── */
    header {
      padding: 18px 20px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .pokeball {
      width: 36px; height: 36px;
      position: relative;
      flex-shrink: 0;
    }
    .pokeball svg { width: 100%; height: 100%; }
    .pokeball.spinning svg { animation: spin 1.2s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .header-text h1 {
      font-family: var(--font-head);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: var(--accent);
    }
    .header-text p {
      font-size: 10px;
      color: var(--subtext);
      margin-top: 1px;
      letter-spacing: 0.05em;
    }

    .header-badge {
      margin-left: auto;
      font-size: 10px;
      font-family: var(--font-mono);
      padding: 3px 8px;
      border-radius: 20px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: all 0.3s;
    }
    .badge-idle    { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }
    .badge-running { background: rgba(0,229,160,0.12); color: var(--green); border: 1px solid rgba(0,229,160,0.3); }
    .badge-queue   { background: rgba(255,59,92,0.15); color: var(--red); border: 1px solid rgba(255,59,92,0.4); animation: pulse-badge 1s ease-in-out infinite; }
    @keyframes pulse-badge { 0%,100%{opacity:1} 50%{opacity:0.6} }

    /* ── Status hero ── */
    .hero {
      padding: 24px 20px;
      flex-shrink: 0;
    }

    .status-ring-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .status-ring {
      width: 140px; height: 140px;
      position: relative;
    }
    .status-ring svg {
      width: 100%; height: 100%;
      transform: rotate(-90deg);
    }
    .ring-track { fill: none; stroke: var(--border); stroke-width: 3; }
    .ring-fill  {
      fill: none; stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 376;
      stroke-dashoffset: 376;
      transition: stroke-dashoffset 0.6s ease, stroke 0.4s;
    }
    .ring-fill.active   { stroke: var(--green); stroke-dashoffset: 0; }
    .ring-fill.queue    { stroke: var(--red);   stroke-dashoffset: 0; animation: ring-pulse 1s ease-in-out infinite; }
    @keyframes ring-pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

    .ring-inner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .ring-icon { font-size: 32px; line-height: 1; }
    .ring-label {
      font-family: var(--font-head);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--subtext);
    }

    .status-text {
      text-align: center;
    }
    .status-title {
      font-family: var(--font-head);
      font-size: 22px;
      font-weight: 800;
      transition: color 0.3s;
    }
    .status-title.idle    { color: var(--muted); }
    .status-title.normal  { color: var(--green); }
    .status-title.queue   { color: var(--red); }
    .status-subtitle {
      font-size: 12px;
      color: var(--subtext);
      margin-top: 4px;
    }

    /* ── Stats row ── */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      padding: 0 20px 20px;
      flex-shrink: 0;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
    }
    .stat-val {
      font-family: var(--font-head);
      font-size: 18px;
      font-weight: 800;
      color: var(--accent);
    }
    .stat-lbl {
      font-size: 9px;
      color: var(--subtext);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* ── Controls ── */
    .controls {
      display: flex;
      gap: 10px;
      padding: 0 20px 16px;
      flex-shrink: 0;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-family: var(--font-head);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.96); }

    .btn-start {
      background: var(--accent);
      color: #0a0a0f;
    }
    .btn-stop {
      background: rgba(255,59,92,0.15);
      color: var(--red);
      border: 1px solid rgba(255,59,92,0.3);
    }
    .btn-check {
      flex: 0 0 auto;
      width: 50px;
      background: var(--surface);
      color: var(--subtext);
      border: 1px solid var(--border);
      font-size: 18px;
    }
    .btn:disabled { opacity: 0.4; }

    /* ── Log ── */
    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px 8px;
      flex-shrink: 0;
    }
    .log-header span {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--subtext);
    }
    .log-clear {
      font-size: 10px;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font-mono);
      -webkit-tap-highlight-color: transparent;
    }

    .log {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px;
      -webkit-overflow-scrolling: touch;
    }
    .log::-webkit-scrollbar { display: none; }

    .log-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 8px;
      color: var(--muted);
    }
    .log-empty-icon { font-size: 32px; opacity: 0.4; }
    .log-empty-text { font-size: 12px; }

    .log-entry {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      animation: slide-in 0.2s ease;
    }
    @keyframes slide-in { from { opacity:0; transform: translateY(-4px); } }

    .log-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      margin-top: 5px;
      flex-shrink: 0;
    }
    .dot-ok    { background: var(--green); }
    .dot-queue { background: var(--red); box-shadow: 0 0 6px var(--red); }
    .dot-error { background: var(--accent); }

    .log-msg { font-size: 11px; color: var(--text); line-height: 1.5; flex: 1; }
    .log-msg.queue { color: var(--red); font-weight: 500; }
    .log-time { font-size: 10px; color: var(--muted); flex-shrink: 0; margin-top: 2px; }

    /* ── URL bar ── */
    .url-bar {
      padding: 0 20px 12px;
      flex-shrink: 0;
    }
    .url-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--subtext);
      outline: none;
    }
    .url-input:focus { border-color: var(--accent); color: var(--text); }

    /* ── Alert overlay ── */
    .alert-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }
    .alert-overlay.show { display: flex; }
    .alert-box {
      background: var(--surface);
      border: 1px solid rgba(255,59,92,0.5);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      max-width: 320px;
      width: 100%;
      animation: pop-in 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes pop-in { from { opacity:0; transform:scale(0.8); } }
    .alert-emoji { font-size: 56px; margin-bottom: 12px; }
    .alert-title {
      font-family: var(--font-head);
      font-size: 24px;
      font-weight: 800;
      color: var(--red);
      margin-bottom: 8px;
    }
    .alert-body { font-size: 13px; color: var(--subtext); line-height: 1.6; margin-bottom: 24px; }
    .alert-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #0a0a0f;
      border: none;
      border-radius: 12px;
      font-family: var(--font-head);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .alert-open {
      margin-top: 10px;
      width: 100%;
      padding: 12px;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-family: var(--font-head);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="shell">

  <!-- Header -->
  <header>
    <div class="pokeball" id="pokeball">
      <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="18" cy="18" r="17" stroke="#ffcb05" stroke-width="2"/>
        <path d="M1 18h34" stroke="#ffcb05" stroke-width="2"/>
        <path d="M1 18A17 17 0 0 1 35 18" stroke="#ff3b5c" stroke-width="2" fill="none"/>
        <circle cx="18" cy="18" r="5" fill="#0a0a0f" stroke="#ffcb05" stroke-width="2"/>
        <circle cx="18" cy="18" r="2.5" fill="#ffcb05"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>PC MONITOR</h1>
      <p>POKÉMON CENTER DROP DETECTOR</p>
    </div>
    <div class="header-badge badge-idle" id="badge">IDLE</div>
  </header>

  <!-- Status ring -->
  <div class="hero">
    <div class="status-ring-wrap">
      <div class="status-ring">
        <svg viewBox="0 0 140 140">
          <circle class="ring-track" cx="70" cy="70" r="60"/>
          <circle class="ring-fill" id="ringFill" cx="70" cy="70" r="60"/>
        </svg>
        <div class="ring-inner">
          <div class="ring-icon" id="ringIcon">⏸</div>
          <div class="ring-label" id="ringLabel">PAUSED</div>
        </div>
      </div>
    </div>
    <div class="status-text">
      <div class="status-title idle" id="statusTitle">Not Monitoring</div>
      <div class="status-subtitle" id="statusSub">Press Start to begin</div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-val" id="statChecks">0</div>
      <div class="stat-lbl">Checks</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="statDrops">0</div>
      <div class="stat-lbl">Drops</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="statInterval">20s</div>
      <div class="stat-lbl">Interval</div>
    </div>
  </div>

  <!-- URL bar -->
  <div class="url-bar">
    <input class="url-input" id="urlInput" type="url"
      value="https://www.pokemoncenter.com/"
      placeholder="https://www.pokemoncenter.com/" />
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn btn-start" id="btnStart" onclick="startMonitor()">START</button>
    <button class="btn btn-stop" id="btnStop" onclick="stopMonitor()" style="display:none">STOP</button>
    <button class="btn btn-check" id="btnCheck" onclick="checkNow()" disabled title="Check now">↻</button>
  </div>

  <!-- Log -->
  <div class="log-header">
    <span>Activity Log</span>
    <button class="log-clear" onclick="clearLog()">Clear</button>
  </div>
  <div class="log" id="log">
    <div class="log-empty" id="logEmpty">
      <div class="log-empty-icon">🔍</div>
      <div class="log-empty-text">No activity yet</div>
    </div>
  </div>

</div>

<!-- Alert overlay -->
<div class="alert-overlay" id="alertOverlay">
  <div class="alert-box">
    <div class="alert-emoji">🚨</div>
    <div class="alert-title">DROP DETECTED!</div>
    <div class="alert-body" id="alertBody">Queue page detected on Pokémon Center. Get in there NOW!</div>
    <button class="alert-btn" onclick="dismissAlert()">GOT IT</button>
    <button class="alert-open" onclick="openSite()">Open Pokémon Center →</button>
  </div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────
let running = false;
let timer = null;
let checks = 0;
let drops = 0;
let queueActive = false;
let consecutiveErrors = 0;
const INTERVAL = 20000; // 20s

const PROXY = 'https://api.allorigins.win/get?url=';

const BODY_SIGNALS = [
  '_incapsula_resource', 'incapsula', 'wmwaitingroom',
  'waiting room', 'virtual queue', 'you are in the queue',
  'estimated wait', 'queue-it.net'
];
const NORMAL_SIGNALS = ['pokemoncenter.com', 'add to cart', 'pokemon center', 'shop'];

// ── Controls ──────────────────────────────────────────────────────
function startMonitor() {
  running = true;
  queueActive = false;
  consecutiveErrors = 0;
  document.getElementById('btnStart').style.display = 'none';
  document.getElementById('btnStop').style.display = '';
  document.getElementById('btnCheck').disabled = false;
  document.getElementById('urlInput').disabled = true;
  document.getElementById('pokeball').classList.add('spinning');
  setBadge('running');
  setStatus('normal-idle');
  addLog('ok', 'Monitoring started');
  doCheck();
  timer = setInterval(doCheck, INTERVAL);
}

function stopMonitor() {
  running = false;
  clearInterval(timer);
  timer = null;
  document.getElementById('btnStart').style.display = '';
  document.getElementById('btnStop').style.display = 'none';
  document.getElementById('btnCheck').disabled = true;
  document.getElementById('urlInput').disabled = false;
  document.getElementById('pokeball').classList.remove('spinning');
  setBadge('idle');
  setStatus('idle');
  addLog('ok', 'Monitoring stopped');
}

function checkNow() {
  if (running) doCheck();
}

function clearLog() {
  const log = document.getElementById('log');
  log.innerHTML = '<div class="log-empty" id="logEmpty"><div class="log-empty-icon">🔍</div><div class="log-empty-text">No activity yet</div></div>';
}

// ── Detection ─────────────────────────────────────────────────────
async function doCheck() {
  const url = document.getElementById('urlInput').value.trim();
  checks++;
  document.getElementById('statChecks').textContent = checks;

  try {
    // Use allorigins CORS proxy to fetch the page from the browser
    const proxyUrl = PROXY + encodeURIComponent(url);
    const res = await fetch(proxyUrl, { signal: AbortSignal.timeout(18000) });
    const json = await res.json();

    const status = json.status?.http_code ?? 0;
    const body = (json.contents ?? '').toLowerCase().slice(0, 80000);
    const finalUrl = (json.status?.url ?? '').toLowerCase();

    const result = classify(status, finalUrl, body);
    handleResult(result);

  } catch (e) {
    consecutiveErrors++;
    const msg = e.name === 'TimeoutError' ? 'Request timed out' : 'Network error';
    addLog('error', `${msg} (#${consecutiveErrors})`);
    if (consecutiveErrors >= 3 && !queueActive) {
      handleQueue(`Site unreachable ${consecutiveErrors}x — possible overload`);
    }
  }
}

function classify(status, finalUrl, body) {
  // URL signals
  for (const sig of BODY_SIGNALS) {
    if (finalUrl.includes(sig)) return { queue: true, reason: `Redirect URL contains '${sig}'` };
  }
  // Body signals
  for (const sig of BODY_SIGNALS) {
    if (body.includes(sig)) return { queue: true, reason: `Page body contains '${sig}'` };
  }
  // 503
  if (status === 503) return { queue: true, reason: 'HTTP 503 — overloaded/queue active' };
  // 200 with no normal content
  if (status === 200) {
    const hasNormal = NORMAL_SIGNALS.some(s => body.includes(s));
    if (!hasNormal) return { queue: true, reason: 'No storefront content found — likely queue page' };
    return { queue: false, reason: `Site normal (HTTP 200)` };
  }
  return { queue: false, reason: `HTTP ${status}` };
}

function handleResult(result) {
  consecutiveErrors = 0;
  if (result.queue) {
    if (!queueActive) handleQueue(result.reason);
    else addLog('queue', `Still in queue — ${result.reason}`);
  } else {
    if (queueActive) {
      queueActive = false;
      setBadge('running');
      setStatus('normal-idle');
      addLog('ok', 'Queue cleared — site back to normal ✅');
    } else {
      addLog('ok', result.reason);
      setStatus('normal-idle');
    }
  }
}

function handleQueue(reason) {
  queueActive = true;
  drops++;
  document.getElementById('statDrops').textContent = drops;
  setBadge('queue');
  setStatus('queue');
  addLog('queue', `🚨 QUEUE DETECTED — ${reason}`);
  showAlert(reason);
  // Try to vibrate
  if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 300]);
  // Push notification
  if (Notification.permission === 'granted') {
    new Notification('🚨 Pokémon Center DROP!', {
      body: 'Queue detected — open the site NOW!',
      icon: 'icon-192.png',
      tag: 'pc-drop',
      renotify: true
    });
  }
}

// ── UI helpers ────────────────────────────────────────────────────
function setBadge(state) {
  const b = document.getElementById('badge');
  b.className = 'header-badge';
  if (state === 'idle')    { b.classList.add('badge-idle');    b.textContent = 'IDLE'; }
  if (state === 'running') { b.classList.add('badge-running'); b.textContent = 'LIVE'; }
  if (state === 'queue')   { b.classList.add('badge-queue');   b.textContent = 'DROP!'; }
}

function setStatus(state) {
  const title = document.getElementById('statusTitle');
  const sub   = document.getElementById('statusSub');
  const icon  = document.getElementById('ringIcon');
  const label = document.getElementById('ringLabel');
  const ring  = document.getElementById('ringFill');

  title.className = 'status-title';
  ring.className  = 'ring-fill';

  if (state === 'idle') {
    title.classList.add('idle');
    title.textContent = 'Not Monitoring';
    sub.textContent   = 'Press Start to begin';
    icon.textContent  = '⏸';
    label.textContent = 'PAUSED';
  } else if (state === 'normal-idle') {
    title.classList.add('normal');
    title.textContent = 'Site is Normal';
    sub.textContent   = `Checking every ${INTERVAL/1000}s`;
    icon.textContent  = '✓';
    label.textContent = 'NORMAL';
    ring.classList.add('active');
  } else if (state === 'queue') {
    title.classList.add('queue');
    title.textContent = 'QUEUE DETECTED!';
    sub.textContent   = 'Open pokemoncenter.com NOW 🎉';
    icon.textContent  = '🚨';
    label.textContent = 'DROP!';
    ring.classList.add('queue');
  }
}

function addLog(type, msg) {
  const logEl = document.getElementById('log');
  const empty = document.getElementById('logEmpty');
  if (empty) empty.remove();

  const now = new Date();
  const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  const dotClass = type === 'ok' ? 'dot-ok' : type === 'queue' ? 'dot-queue' : 'dot-error';
  const msgClass = type === 'queue' ? 'log-msg queue' : 'log-msg';

  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML = `
    <div class="log-dot ${dotClass}"></div>
    <div class="${msgClass}">${msg}</div>
    <div class="log-time">${time}</div>
  `;
  logEl.prepend(entry);

  // Keep max 100 entries
  const entries = logEl.querySelectorAll('.log-entry');
  if (entries.length > 100) entries[entries.length - 1].remove();
}

// ── Alert ─────────────────────────────────────────────────────────
function showAlert(reason) {
  document.getElementById('alertBody').textContent = `${reason}\n\nOpen Pokémon Center and get in line NOW!`;
  document.getElementById('alertOverlay').classList.add('show');
}
function dismissAlert() {
  document.getElementById('alertOverlay').classList.remove('show');
}
function openSite() {
  window.open(document.getElementById('urlInput').value, '_blank');
  dismissAlert();
}

// ── Notification permission ───────────────────────────────────────
if ('Notification' in window && Notification.permission === 'default') {
  setTimeout(() => Notification.requestPermission(), 2000);
}

// ── Interval display ──────────────────────────────────────────────
document.getElementById('statInterval').textContent = (INTERVAL / 1000) + 's';
</script>
</body>
</html>
